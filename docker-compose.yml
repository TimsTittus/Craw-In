version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: info_os
      POSTGRES_USER: os_admin
      POSTGRES_PASSWORD: local_secure_pwd
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - '6333:6333'
      - '6334:6334'
volumes:
  pgdata: