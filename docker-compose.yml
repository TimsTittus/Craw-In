version: '3.8'
services:
  redis:
    image: redis:alpine
    container_name: omni_redis
    ports: ['6379:6379']
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: omni_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports: ['9200:9200']
  api:
    build: .
    container_name: omni_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ['8000:8000']
    depends_on: ['redis', 'elasticsearch']
    volumes: ['.:/app']
  spider_worker:
    build: .
    container_name: omni_worker
    command: python worker.py
    depends_on: ['redis', 'elasticsearch']
    volumes: ['.:/app']