services:
  postgres:
    image: postgres:16-alpine
    container_name: crawin_postgres
    environment:
      POSTGRES_DB: info_os
      POSTGRES_USER: os_admin
      POSTGRES_PASSWORD: local_secure_pwd
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: crawin_redis
    ports:
      - '6379:6379'

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: crawin_qdrant
    ports:
      - '6333:6333'
      - '6334:6334'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crawin_backend
    ports:
      - "8000:8000"
    volumes:
      - ./keyword_store.db:/app/keyword_store.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://os_admin:local_secure_pwd@postgres:5432/info_os
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
    depends_on:
      - postgres
      - redis
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crawin_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: