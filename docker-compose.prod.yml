version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crawin_backend
    ports:
      - "8000:8000"
    volumes:
      - ./keyword_store.db:/app/keyword_store.db
    environment:
      - PYTHONUNBUFFERED=1
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crawin_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend